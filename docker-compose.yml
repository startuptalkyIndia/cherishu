services:
  db:
    image: postgres:16-alpine
    container_name: cherishu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cherishu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: cherishu
    volumes:
    - cherishu_db:/var/lib/postgresql/data
    networks:
    - cherishu_net
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U cherishu -d cherishu
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    memswap_limit: 1500m
    cpus: 1.0
  app:
    build: .
    container_name: cherishu-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cherishu:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/cherishu?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: 'true'
      NEXTAUTH_URL: https://cherishu.talkytools.com
      NODE_ENV: production
    ports:
    - 127.0.0.1:3045:3045
    networks:
    - cherishu_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3045/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 1g
    memswap_limit: 1500m
    cpus: 1.5
networks:
  cherishu_net: null
volumes:
  cherishu_db: null
